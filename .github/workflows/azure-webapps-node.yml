# Build and deploy to Azure App Service by branch:
#   - main               → EnigmaWebsiteDev  (https://enigmawebsitedev.azurewebsites.net)
#   - production-release → EnigmaWebsiteProd (https://enigmawebsiteprod.azurewebsites.net)
#
# Secrets required:
#   - AZURE_WEBAPP_PROD_PUBLISH_PROFILE_ENIGMA_WEBSITE  (EnigmaWebsiteProd)
#   - AZURE_WEBAPP_DEV_PUBLISH_PROFILE_ENIGMA_WEBSITE   (EnigmaWebsiteDev)
#
# To get a publish profile: Azure Portal → App Service → Overview → Get publish profile
#
# Optional SBOM secrets:
#   - DEPENDENCY_TRACK_API_KEY
#   - DEPENDENCY_TRACK_PROJECT

on:
  push:
    branches: [ "main", "production-release" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_PROD_NAME: EnigmaWebsiteProd
  AZURE_WEBAPP_DEV_NAME: EnigmaWebsiteDev
  AZURE_WEBAPP_PACKAGE_PATH: './dist'
  NODE_VERSION: '20.x'
  POSTHOG_CLI_API_KEY: ${{ secrets.POSTHOG_CLI_API_KEY }}
  POSTHOG_CLI_PROJECT_ID: '191523'
  POSTHOG_CLI_HOST: https://eu.i.posthog.com
  DEPENDENCY_TRACK_URL: http://51.15.201.73
  DEPENDENCY_TRACK_API_URL: http://51.15.201.73:8080/api/v1/bom
  DEPENDENCY_TRACK_API_KEY: ${{ secrets.DEPENDENCY_TRACK_API_KEY }}
  DEPENDENCY_TRACK_PROJECT: ${{ secrets.DEPENDENCY_TRACK_PROJECT }}

permissions:
  contents: read

concurrency:
  group: azure-website-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: npm install, build, and test
      run: |
        npm install
        npm run build --if-present
        npm run test --if-present

    - name: Upload artifact for deployment job
      uses: actions/upload-artifact@v4
      with:
        name: node-app
        path: .

  deploy-dev:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Development'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    concurrency:
      group: azure-EnigmaWebsiteDev-deploy
      cancel-in-progress: false

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: Deploy to Azure WebApp (Development)
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_DEV_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_DEV_PUBLISH_PROFILE_ENIGMA_WEBSITE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}

  deploy-prod:
    if: github.ref == 'refs/heads/production-release'
    permissions:
      contents: none
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    concurrency:
      group: azure-EnigmaWebsiteProd-deploy
      cancel-in-progress: false

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: node-app

    - name: Deploy to Azure WebApp (Production)
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ env.AZURE_WEBAPP_PROD_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PROD_PUBLISH_PROFILE_ENIGMA_WEBSITE }}
        package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
